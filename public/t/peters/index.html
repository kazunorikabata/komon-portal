  }

  /* ---------- 入金確認（売上精算書の支払金額） ---------- */

  function payRows() {
    if (!state.sr) return [];
    return Object.keys(state.sr).sort().reverse().map(m => {
      const x = state.sr[m];
      const due = x.payDate || monthEnd(shiftMonth(m, 1));
      const plan = srCalc(x, state.srSet, m).pay;
      const p = (state.srPaid || {})[m];
      const got = p ? fnum(p.amount) : 0;
      let st;
      if (p && got >= plan) st = { cls: 'locked', label: '入金済み' };
      else if (p && got > 0) st = { cls: 'part', label: '一部入金' };
      else if (today > due) st = { cls: 'late', label: '期限を過ぎています' };
      else st = { cls: 'open', label: '入金待ち' };
      return { m, due, plan, p, got, diff: p ? got - plan : null, st };
    });
  }

  // 預金出納帳から、同じ金額の入金を探す
  function payCandidate(r) {
    return state.rows.bank.find(b => b.in === r.plan && b.date >= `${r.m}-01` && !Object.values(state.srPaid || {}).some(p => p.bankId === b.id));
  }

  function renderPay() {
    const rows = payRows();
    const waiting = rows.filter(r => !r.p || r.got < r.plan);
    const late = rows.filter(r => r.st.cls === 'late');
    const md2 = s2 => { const [y2, a, b2] = s2.split('-'); return `${y2}/${Number(a)}/${Number(b2)}`; };
    let h = `<div class="ledger-head" style="margin-top:12px"><h2>入金確認</h2><p>売上精算書の支払金額が、予定日までに入金されたかを確認します。</p></div>
      <div class="chips">
      <span class="chip">入金待ち <b>${waiting.length}</b> 件・<b>${yen(waiting.reduce((t, r) => t + r.plan - r.got, 0))}</b> 円</span>
      ${late.length ? `<span class="chip" style="color:var(--out);border-color:var(--out)">期限を過ぎた入金 <b style="color:var(--out)">${late.length}</b> 件</span>` : ''}</div>
      <div class="table-box"><table><thead><tr><th>精算書の月</th><th>支払予定日</th><th class="num">予定額</th><th>入金日</th><th class="num">入金額</th><th class="num">差額</th><th>状況</th><th></th></tr></thead><tbody>`;
    if (!rows.length) h += `<tr><td colspan="8" class="empty">まだ売上精算書がありません。「売上精算書」タブで保存すると、ここに出ます。</td></tr>`;
    for (const r of rows) {
      const editing = view.payEdit === r.m;
      h += `<tr class="${editing ? 'editing' : ''}"><td>${monthName(r.m)}分</td><td class="date">${md2(r.due)}</td><td class="num">${yen(r.plan)}</td>
        <td class="date">${r.p?.date ? md2(r.p.date) : ''}</td><td class="num">${r.p ? yen(r.got) : ''}</td>
        <td class="num ${r.diff ? 'out' : ''}">${r.diff === null ? '' : r.diff === 0 ? '0' : (r.diff > 0 ? '+' : '−') + yen(Math.abs(r.diff))}</td>
        <td><span class="pill ${r.st.cls}">${r.st.label}</span>${r.p?.memo ? `<div style="font-size:12px;color:var(--ink-soft)">${esc(r.p.memo)}</div>` : ''}</td>
        <td><div class="row-actions">${editing ? '' : `<button type="button" class="link-btn" data-payedit="${r.m}">${r.p ? '直す' : '入金を記録'}</button>`}</div></td></tr>`;
      if (editing) {
        const c = null;
        h += `<tr class="editing"><td colspan="8"><div class="pay-edit">
          ${c ? `<div class="cand"><span>預金出納帳に ${md2(c.date)}「${esc(c.desc)}${c.partner ? '・' + esc(c.partner) : ''}」${yen(c.in)}円 の入金があります。</span><button type="button" class="btn ghost" data-usecand="${c.id}">この入金を使う</button></div>` : ''}
          <div class="fields">
            <label class="f" for="pay-date">入金日<input type="date" id="pay-date" value="${r.p?.date || ''}"></label>
            <label class="f" for="pay-amount">入金額（円）<input type="number" id="pay-amount" min="0" step="1" inputmode="numeric" value="${r.p ? r.got : r.plan}"></label>
            <label class="f wide" for="pay-memo">メモ（任意）<input type="text" id="pay-memo" value="${esc(r.p?.memo || '')}" placeholder="例：振込手数料 440円 差し引き"></label>
          </div>
          <div class="form-foot"><span class="msg" id="payMsg" role="status"></span>
            <div style="display:flex;gap:8px;flex-wrap:wrap">${r.p ? '<button type="button" class="btn ghost" id="payClear">記録を消す</button>' : ''}<button type="button" class="btn ghost" id="payCancel">やめる</button><button type="button" class="btn" id="paySave">保存する</button></div></div>
        </div></td></tr>`;
      }
    }
    $('payBox').innerHTML = h + '</tbody></table></div>';
  }

  $('payBox').addEventListener('click', e => {
    const t = e.target;
    if (t.dataset.payedit) { view.payEdit = t.dataset.payedit; renderPay(); $('pay-date').focus(); return; }
    if (t.id === 'payCancel') { view.payEdit = null; renderPay(); return; }
    if (t.dataset.usecand) {
      const b = state.rows.bank.find(x => x.id === t.dataset.usecand);
      $('pay-date').value = b.date; $('pay-amount').value = b.in; view.payBank = b.id; return;
    }
    if (t.id === 'payClear') { delete state.srPaid[view.payEdit]; view.payEdit = null; save(); render(); return; }
    if (t.id === 'paySave') {
      const date = $('pay-date').value, amount = num($('pay-amount').value), memo = $('pay-memo').value.trim();
      const m = $('payMsg');
      if (!date) { m.textContent = '入金日を入力してください。'; return; }
      if (!amount) { m.textContent = '入金額を入力してください。'; return; }
      (state.srPaid ||= {})[view.payEdit] = { date, amount, ...(memo && { memo }), ...(view.payBank && { bankId: view.payBank }) };
      view.payEdit = null; view.payBank = null; save(); render();
    }
  });

  /* ---------- 仕入一覧（請求書の一覧） ---------- */

  const SITES = ['当月末', '翌5日', '翌10日', '翌15日', '翌20日', '翌25日', '翌末', '翌々5日', '翌々10日', '翌々15日', '翌々20日', '翌々末'];
  const ACCT_TYPES = ['普通', '当座'];
  // 締め日（月末）と支払サイトから支払期日を出す
  function dueOf(m, site) {
    const mm = /^(当月|翌々|翌)(末|(\d+)日)$/.exec(site || '');
    if (!mm) return '';
    const tm = shiftMonth(m, mm[1] === '当月' ? 0 : mm[1] === '翌' ? 1 : 2);
    if (mm[2] === '末') return monthEnd(tm);
    const end = monthEnd(tm);
    const dd = `${tm}-${String(Number(mm[3])).padStart(2, '0')}`;
    return dd > end ? end : dd;
  }
  const plInv = (m, sid) => ((state.inv || {})[m] || {})[sid] || {};
  const plTotal = o => (o.t10 || 0) + (o.t8 || 0) + (o.ot || 0);
  const plInvoices = m => (state.suppliers || []).filter(sp => plTotal(plInv(m, sp.id)) > 0);
  const plPay = (sp, o) => plTotal(o) ? plTotal(o) - (sp.fee || 0) : 0;
  const plPaidOf = (m, sid) => ((state.plPaid || {})[m] || {})[sid] || {};
  function plStatus(m, sp) {
    const o = plInv(m, sp.id); if (!plTotal(o)) return null;
    const need = plTotal(o), p = plPaidOf(m, sp.id), got = p.date ? (p.amount || 0) + (p.fee || 0) : 0;
    if (p.date && got >= need) return { cls: 'locked', label: '支払済み', need, got };
    if (p.date && got > 0) return { cls: 'part', label: '一部支払い', need, got };
    if (today > dueOf(m, sp.site)) return { cls: 'late', label: '期日を過ぎています', need, got };
    return { cls: 'open', label: '未払い', need, got };
  }
  const ymd = s2 => { const [a, b2, c] = s2.split('-'); return `${a}/${Number(b2)}/${Number(c)}`; };

  // 買掛金の残高：その日までの請求額 − その日までの支払（振込額＋手数料）。請求の月は問わない
  function apBalance(sid, endDate) {
    let bal = 0;
    for (const [m, inv] of Object.entries(state.inv || {})) if (monthEnd(m) <= endDate && inv[sid]) bal += plTotal(inv[sid]);
    for (const ps of Object.values(state.plPaid || {})) { const p = ps[sid]; if (p?.date && p.date <= endDate) bal -= (p.amount || 0) + (p.fee || 0); }
    return bal;
  }
  function apPaidIn(sid, m) {
    let t = 0;
    for (const ps of Object.values(state.plPaid || {})) { const p = ps[sid]; if (p?.date?.startsWith(m)) t += (p.amount || 0) + (p.fee || 0); }
    return t;
  }

  function plSorted() {
    const order = s2 => SITES.indexOf(s2.site);
    return (state.suppliers || []).slice().sort((a, b) => order(a) - order(b) || String(a.cat).localeCompare(String(b.cat), 'ja', { numeric: true }));
  }

  function renderPL() {
    const m = view.month, lock = locked(), dis = lock ? ' disabled' : '';
    $('ledgerTitle').textContent = `仕入一覧（請求書）　${monthName(m)}締め`;
    $('ledgerHint').textContent = `${monthName(m)}末締めで届いた請求書の金額を、税率ごとに入れてください（税込）。届いていない業者は空欄のままで構いません。`;
    let h = `<div class="chips" id="plChips"></div>
      <div class="table-box"><table class="pl"><thead><tr><th>分類</th><th>業者名</th><th>支払サイト</th><th>支払期日</th>
        <th class="num">10%対象</th><th class="num">8%対象</th><th class="num">その他</th><th class="num">請求額</th><th class="num">手数料（予定）</th><th class="num">振込予定額</th><th>振込日</th><th class="num">振込額</th><th class="num">振込手数料</th><th>状況</th><th>振込先</th></tr></thead><tbody>`;
    let lastSite = null;
    for (const sp of plSorted()) {
      if (sp.site !== lastSite) { h += `<tr class="grp"><td colspan="15">支払サイト：${esc(sp.site)}（支払期日 ${ymd(dueOf(m, sp.site))}）</td></tr>`; lastSite = sp.site; }
      const o = plInv(m, sp.id);
      const cell = k => `<td class="num"><input type="number" id="pl-${sp.id}-${k}" data-pl="${sp.id}" data-k="${k}" min="0" step="1" inputmode="numeric" value="${o[k] ?? ''}" aria-label="${esc(sp.name)} ${k === 't10' ? '10%対象' : k === 't8' ? '8%対象' : 'その他'}"${dis}></td>`;
      h += `<tr id="plr-${sp.id}" class="${plTotal(o) ? '' : 'noinv'}"><td class="num">${esc(sp.cat)}</td><td>${esc(sp.name)}</td><td>${esc(sp.site)}</td><td class="date">${ymd(dueOf(m, sp.site))}</td>
        ${cell('t10')}${cell('t8')}${cell('ot')}
        <td class="num" id="pl-${sp.id}-sum"></td><td class="num">${yen(sp.fee || 0)}</td><td class="num" id="pl-${sp.id}-pay"></td>
        <td class="date" id="pl-${sp.id}-pdate"></td><td class="num" id="pl-${sp.id}-pamt"></td><td class="num" id="pl-${sp.id}-pfee"></td>
        <td id="pl-${sp.id}-st"></td>
        <td class="bank">${esc(sp.bank)} ${esc(sp.branch)}<br>${esc(sp.type)} ${esc(sp.acct)}</td></tr>`;
    }
    if (!(state.suppliers || []).length) h += `<tr><td colspan="15" class="empty">業者がまだ登録されていません。下の「業者の登録」から追加してください。</td></tr>`;
    h += `</tbody><tbody id="plFoot"></tbody></table></div>
      <div class="pl-sum">
        <div class="entry"><h3>支払期日ごとの合計（振込額）</h3><div class="table-box"><table id="plDue"></table></div></div>
        <div class="entry"><h3>税率ごとの合計（請求額）</h3><div class="table-box"><table id="plTax"></table></div>
          <div class="form-foot"><span class="msg" id="plMsg" role="status"></span><button type="button" class="btn ghost" id="plPrint">印刷する</button></div></div>
      </div>
      <div id="plPayPanel"></div>
      <div class="entry"><h3 id="plBalTitle">買掛金の月末残高</h3>
        <p style="margin:0;font-size:12px;color:var(--ink-soft)">前の月までに払い残した分も含めた、月末時点の未払い残高です。支払は、どの月の請求書の分でも振込日の月で数えます。</p>
        <div class="table-box"><table id="plBal" style="min-width:640px"></table></div></div>
      ${plMasterHtml()}`;
    $('plBox').innerHTML = h;
    updatePL();
  }

  function updatePL() {
    const m = view.month;
    const sps = state.suppliers || [];
    let t = { t10: 0, t8: 0, ot: 0, sum: 0, fee: 0, pay: 0, paid: 0, paidAmt: 0, paidFee: 0, left: 0 }, n = 0;
    const due = {}, dueLeft = {};
    for (const sp of sps) {
      const o = plInv(m, sp.id), sum = plTotal(o), pay = plPay(sp, o);
      if ($(`pl-${sp.id}-sum`)) { $(`pl-${sp.id}-sum`).textContent = sum ? yen(sum) : ''; $(`pl-${sp.id}-pay`).textContent = sum ? yen(pay) : ''; }
      $(`plr-${sp.id}`)?.classList.toggle('noinv', !sum);
      const st = plStatus(m, sp);
      if ($(`pl-${sp.id}-st`)) {
        $(`pl-${sp.id}-st`).innerHTML = st ? `<span class="pill ${st.cls}">${st.label}</span>` : '';
        const pp0 = plPaidOf(m, sp.id);
        $(`pl-${sp.id}-pdate`).textContent = pp0.date ? ymd(pp0.date) : '';
        $(`pl-${sp.id}-pamt`).textContent = pp0.date ? yen(pp0.amount || 0) : '';
        $(`pl-${sp.id}-pfee`).textContent = pp0.date ? yen(pp0.fee || 0) : '';
      }
      if (!sum) continue;
      const pp = plPaidOf(m, sp.id);
      if (pp.date) { t.paidAmt += pp.amount || 0; t.paidFee += pp.fee || 0; }
      t.left += Math.max(0, st.need - st.got);
      n++; for (const k of ['t10', 't8', 'ot']) t[k] += o[k] || 0;
      t.sum += sum; t.fee += sp.fee || 0; t.pay += pay;
      const dd = dueOf(m, sp.site); due[dd] = (due[dd] || 0) + pay; dueLeft[dd] = (dueLeft[dd] || 0) + Math.max(0, st.need - st.got);
    }
    $('plFoot').innerHTML = `<tr class="total"><td></td><td>合計（${n}社）</td><td></td><td></td><td class="num">${yen(t.t10)}</td><td class="num">${yen(t.t8)}</td><td class="num">${yen(t.ot)}</td><td class="num">${yen(t.sum)}</td><td class="num">${yen(t.fee)}</td><td class="num">${yen(t.pay)}</td><td></td><td class="num">${yen(t.paidAmt)}</td><td class="num">${yen(t.paidFee)}</td><td></td><td></td></tr>`;
    $('plDue').innerHTML = `<thead><tr><th>支払期日</th><th class="num">振込予定額</th><th class="num">未払い</th><th></th></tr></thead><tbody>${Object.keys(due).sort().map(dd => `<tr><td class="date">${ymd(dd)}</td><td class="num">${yen(due[dd])}</td>
        <td class="num ${dueLeft[dd] && today > dd ? 'out' : ''}">${dueLeft[dd] ? yen(dueLeft[dd]) : '0'}</td>
        <td><div style="display:grid;gap:4px;justify-items:start">${dueLeft[dd] ? (today > dd ? '<span class="pill late">期日を過ぎています</span>' : '') : '<span class="pill locked">支払済み</span>'}
          <button type="button" class="link-btn" data-paydue="${dd}">${dueLeft[dd] ? 'まとめて支払済みにする' : '支払を直す'}</button></div></td></tr>`).join('') || '<tr><td colspan="4" class="empty">請求額を入れると出ます</td></tr>'}
      <tr class="total"><td>合計</td><td class="num">${yen(t.pay)}</td><td class="num">${yen(t.left)}</td><td></td></tr></tbody>`;
    renderPayPanel();
    const end = monthEnd(m), prevEnd = monthEnd(shiftMonth(m, -1));
    const bal = sps.map(sp => ({ sp, prev: apBalance(sp.id, prevEnd), inv: plTotal(plInv(m, sp.id)), paid: apPaidIn(sp.id, m), end: apBalance(sp.id, end) }))
      .filter(r => r.prev || r.inv || r.paid || r.end);
    const tb = bal.reduce((a, r) => ({ prev: a.prev + r.prev, inv: a.inv + r.inv, paid: a.paid + r.paid, end: a.end + r.end }), { prev: 0, inv: 0, paid: 0, end: 0 });
    $('plBalTitle').textContent = `買掛金の月末残高（${monthName(m)}末）`;
    $('plBal').innerHTML = `<thead><tr><th>業者名</th><th class="num">前月末の残高</th><th class="num">今月の請求額</th><th class="num">今月の支払</th><th class="num">月末の残高</th></tr></thead><tbody>
      ${bal.map(r => `<tr><td>${esc(r.sp.name)}</td><td class="num">${yen(r.prev)}</td><td class="num">${yen(r.inv)}</td><td class="num">${yen(r.paid)}</td><td class="num${r.end < 0 ? ' out' : ''}">${yen(r.end)}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">まだ残高はありません</td></tr>'}
      <tr class="total"><td>合計</td><td class="num">${yen(tb.prev)}</td><td class="num">${yen(tb.inv)}</td><td class="num">${yen(tb.paid)}</td><td class="num">${yen(tb.end)}</td></tr></tbody>`;
    $('plTax').innerHTML = `<tbody><tr><td>10%対象</td><td class="num">${yen(t.t10)}</td></tr><tr><td>8%対象（軽減）</td><td class="num">${yen(t.t8)}</td></tr><tr><td>その他</td><td class="num">${yen(t.ot)}</td></tr><tr class="total"><td>請求額の合計</td><td class="num">${yen(t.sum)}</td></tr></tbody>`;
    const lateN = (state.suppliers || []).filter(sp => plStatus(m, sp)?.cls === 'late').length;
    $('plChips').innerHTML = `<span class="chip">請求書 <b>${n}</b> 社</span><span class="chip">請求額 <b>${yen(t.sum)}</b></span><span class="chip">振込額 <b>${yen(t.pay)}</b></span><span class="chip">振込済み <b>${yen(t.paidAmt)}</b></span><span class="chip">振込手数料 <b>${yen(t.paidFee)}</b></span><span class="chip">今月分の未払い <b>${yen(t.left)}</b></span>` +
      (lateN ? `<span class="chip" style="color:var(--out);border-color:var(--out)">期日を過ぎた未払い <b style="color:var(--out)">${lateN}</b> 社</span>` : '');
    $('plChips').insertAdjacentHTML('beforeend', `<span class="chip">月末の買掛金残高（過去の月を含む） <b>${yen(tb.end)}</b></span>`);
    return { t, due, n };
  }

  function plMasterHtml() {
    const e = view.plEdit ? (state.suppliers || []).find(x => x.id === view.plEdit) || {} : null;
    const f = (k, label, extra = '') => `<label class="f" for="sp-${k}">${label}<input type="text" id="sp-${k}" value="${esc(e?.[k] ?? '')}"${extra}></label>`;
    const sel = (k, label, opts) => `<label class="f" for="sp-${k}">${label}<select id="sp-${k}">${opts.map(o => `<option${o === (e?.[k] || opts[0]) ? ' selected' : ''}>${o}</option>`).join('')}</select></label>`;
    return `<details class="entry pl-master"${view.plMasterOpen ? ' open' : ''}><summary>業者の登録（${(state.suppliers || []).length}社）</summary>
      <div class="table-box"><table><thead><tr><th>分類</th><th>番号</th><th>業者名</th><th>支払サイト</th><th>銀行・支店</th><th>預金</th><th>口座番号</th><th class="num">振込手数料</th><th></th></tr></thead><tbody>
      ${plSorted().map(sp => `<tr><td>${esc(sp.cat)}</td><td>${esc(sp.no)}</td><td>${esc(sp.name)}</td><td>${esc(sp.site)}</td><td>${esc(sp.bank)} ${esc(sp.branch)}</td><td>${esc(sp.type)}</td><td>${esc(sp.acct)}</td><td class="num">${yen(sp.fee || 0)}</td>
        <td><div class="row-actions"><button type="button" class="link-btn" data-spedit="${sp.id}">直す</button><button type="button" class="link-btn danger" data-spdel="${sp.id}">${view.spDel === sp.id ? '本当に消す' : '消す'}</button></div></td></tr>`).join('')}
      </tbody></table></div>
      <h3 style="margin:0">${e ? '業者を直す' : '業者を追加する'}</h3>
      <div class="fields">
        ${f('cat', '業者分類')}${f('no', '業者番号')}${f('name', '業者名')}${sel('site', '支払サイト', SITES.slice().sort((a, b) => a === '翌末' ? -1 : b === '翌末' ? 1 : 0))}
        ${f('bank', '銀行名')}${f('branch', '支店名')}${sel('type', '預金', ACCT_TYPES)}${f('acct', '口座番号', ' inputmode="numeric"')}
        <label class="f" for="sp-fee">振込手数料（先方負担分・円）<input type="number" id="sp-fee" min="0" step="1" value="${e?.fee ?? 0}"></label>
      </div>
      <div class="form-foot"><span class="msg" id="spMsg" role="status"></span><div style="display:flex;gap:8px">${e ? '<button type="button" class="btn ghost" id="spCancel">やめる</button>' : ''}<button type="button" class="btn" id="spSave">${e ? '直した内容で保存' : '追加する'}</button></div></div>
    </details>`;
  }

  $('plBox').addEventListener('input', e => {
    const t = e.target; if (!t.dataset.pl || locked()) return;
    const m = view.month;
    const o = (((state.inv ||= {})[m] ||= {})[t.dataset.pl] ||= {});
    const v = num(t.value); if (v) o[t.dataset.k] = v; else delete o[t.dataset.k];
    save(); updatePL();
  });
  // 支払期日ごとの業者一覧で、振込日・振込額・振込手数料をまとめて入れる
  function renderPayPanel() {
    const box = $('plPayPanel'); if (!box) return;
    const dd = view.payDue, m = view.month;
    if (!dd) { box.innerHTML = ''; return; }
    const list = plSorted().filter(sp => plTotal(plInv(m, sp.id)) && dueOf(m, sp.site) === dd);
    if (box.dataset.for === dd && box.innerHTML) return;   // 入力中は描き直さない
    box.dataset.for = dd;
    const defDate = dd > today ? today : dd;
    box.innerHTML = `<div class="entry" style="border:2px solid var(--accent)">
      <h3>支払期日 ${ymd(dd)} の支払（${list.length}社）</h3>
      <p style="margin:0;font-size:12px;color:var(--ink-soft)">実際に振り込んだ日・金額・手数料を入れて「支払済みにする」を押してください。最初は予定の金額が入っています。払っていない業者はチェックを外してください。</p>
      <label class="f" for="pp-all" style="max-width:14em">振込日をまとめて入れる<input type="date" id="pp-all" value="${defDate}"></label>
      <div class="table-box"><table style="min-width:640px"><thead><tr><th></th><th>業者名</th><th class="num">請求額</th><th class="num">振込予定額</th><th>振込日</th><th class="num">振込額</th><th class="num">振込手数料</th></tr></thead><tbody>
      ${list.map(sp => { const o = plInv(m, sp.id), pp = plPaidOf(m, sp.id), st = plStatus(m, sp);
        return `<tr><td><input type="checkbox" id="pp-${sp.id}-on" data-ppon="${sp.id}"${st.cls === 'locked' && !pp.date ? '' : ' checked'} aria-label="${esc(sp.name)}を支払済みにする"></td>
          <td>${esc(sp.name)}</td><td class="num">${yen(plTotal(o))}</td><td class="num">${yen(plPay(sp, o))}</td>
          <td><input type="date" id="pp-${sp.id}-date" data-ppd="${sp.id}" value="${pp.date || defDate}" style="width:10em"></td>
          <td class="num"><input type="number" id="pp-${sp.id}-amt" min="0" step="1" inputmode="numeric" value="${pp.date ? pp.amount ?? '' : plPay(sp, o)}" style="width:8em"></td>
          <td class="num"><input type="number" id="pp-${sp.id}-fee" min="0" step="1" inputmode="numeric" value="${pp.date ? pp.fee ?? 0 : sp.fee || 0}" style="width:6em"></td></tr>`; }).join('')}
      </tbody></table></div>
      <div class="form-foot"><span class="msg" id="ppMsg" role="status"></span>
        <div style="display:flex;gap:8px"><button type="button" class="btn ghost" id="ppCancel">やめる</button><button type="button" class="btn" id="ppSave">支払済みにする</button></div></div>
    </div>`;
  }

  $('plBox').addEventListener('input', e => {
    if (e.target.id === 'pp-all') document.querySelectorAll('#plPayPanel [data-ppd]').forEach(el => { el.value = e.target.value; });
  });
  $('plBox').addEventListener('change', e => {
    const t = e.target; if (!t.dataset.pl || !reopened(view.month)) return;
    const sp = state.suppliers.find(x => x.id === t.dataset.pl);
    addLog(view.month, `修正：仕入一覧 ${sp.name} 請求額 ${yen(plTotal(plInv(view.month, sp.id)))}円`); save(); renderTabs();
  });
  $('plBox').addEventListener('toggle', e => { if (e.target.classList?.contains('pl-master')) view.plMasterOpen = e.target.open; }, true);
  $('plBox').addEventListener('click', async e => {
    const t = e.target;
    if (t.dataset.spedit) { view.plEdit = t.dataset.spedit; view.plMasterOpen = true; renderPL(); $('sp-name').focus(); return; }
    if (t.dataset.spdel) {
      if (view.spDel !== t.dataset.spdel) { view.spDel = t.dataset.spdel; renderPL(); return; }
      state.suppliers = state.suppliers.filter(x => x.id !== t.dataset.spdel); view.spDel = null; save(); render(); return;
    }
    if (t.id === 'spCancel') { view.plEdit = null; renderPL(); return; }
    if (t.id === 'spSave') {
      const rec = {};
      for (const k of ['cat', 'no', 'name', 'site', 'bank', 'branch', 'type', 'acct']) rec[k] = $('sp-' + k).value.trim();
      rec.fee = num($('sp-fee').value) || 0;
      if (!rec.name) { $('spMsg').textContent = '業者名を入力してください。'; return; }
      state.suppliers ||= [];
      if (view.plEdit) Object.assign(state.suppliers.find(x => x.id === view.plEdit), rec);
      else state.suppliers.push({ id: id(), ...rec });
      view.plEdit = null; save(); render(); return;
    }
    if (t.dataset.paydue) { view.payDue = t.dataset.paydue; $('plPayPanel').dataset.for = ''; renderPayPanel(); $('pp-all')?.focus(); return; }
    if (t.id === 'ppCancel') { view.payDue = null; renderPayPanel(); return; }
    if (t.id === 'ppSave') {
      const m = view.month, ids = [...document.querySelectorAll('#plPayPanel [data-ppon]')].map(el => el.dataset.ppon);
      let n = 0;
      for (const sid of ids) {
        if (!$(`pp-${sid}-on`).checked) continue;
        const date = $(`pp-${sid}-date`).value;
        if (!date) { $('ppMsg').textContent = '振込日を入れてください。'; return; }
        (((state.plPaid ||= {})[m] ||= {})[sid] = { date, amount: num($(`pp-${sid}-amt`).value) || 0, fee: num($(`pp-${sid}-fee`).value) || 0 });
        n++;
      }
      if (!n) { $('ppMsg').textContent = '支払済みにする業者にチェックを付けてください。'; return; }
      view.payDue = null; save(); updatePL();
      $('plMsg').className = 'msg ok'; $('plMsg').textContent = `${n}社を支払済みにしました。`;
      return;
    }
    if (t.id === 'plPrint') {
      try {
        openPrint(`仕入一覧_${monthName(view.month)}締め.html`, plDoc(view.month));
        $('plMsg').className = 'msg ok'; $('plMsg').textContent = '新しいタブで開きました。印刷してください。';
      } catch (err) { $('plMsg').className = 'msg'; $('plMsg').textContent = err?.code === 'declined' ? '保存をやめました。' : '保存できませんでした。'; }
    }
  });

  function plDoc(m) {
    const { t, due, n } = updatePL();
    // 印刷用は列が多いので文字を少し小さくする
    const rows = plSorted().map(sp => {
      const o = plInv(m, sp.id), sum = plTotal(o);
      return `<tr${sum ? '' : ' class="no"'}><td>${esc(sp.cat)}</td><td>${esc(sp.no)}</td><td class="nm">${esc(sp.name)}</td><td>${esc(sp.site)}</td><td>${esc(sp.bank)}</td><td>${esc(sp.branch)}</td><td>${esc(sp.type)}</td><td>${esc(sp.acct)}</td>
        <td>${ymd(dueOf(m, sp.site))}</td><td class="n">${o.t10 ? yen(o.t10) : ''}</td><td class="n">${o.t8 ? yen(o.t8) : ''}</td><td class="n">${o.ot ? yen(o.ot) : ''}</td>
        <td class="n b">${sum ? '¥' + yen(sum) : ''}</td><td class="n">${sum ? '¥' + yen(sp.fee || 0) : ''}</td><td class="n b">${sum ? yen(plPay(sp, o)) : '0'}</td><td>${plPaidOf(m, sp.id).date ? ymd(plPaidOf(m, sp.id).date) : ''}</td><td class="n">${plPaidOf(m, sp.id).date ? yen(plPaidOf(m, sp.id).amount || 0) : ''}</td><td class="n">${plPaidOf(m, sp.id).date ? yen(plPaidOf(m, sp.id).fee || 0) : ''}</td></tr>`;
    }).join('');
    const tt = new Date();
    return `<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>仕入一覧 ${monthName(m)}締め</title>
<style>
@page { size: A4 landscape; margin: 0; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #e9e9e9; }
body { font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; color: #000; font-size: 7.8pt; }
.bar { background: #eef3f0; padding: 8px 12px; font-size: 10pt; display: flex; gap: 12px; align-items: center; justify-content: center; }
.bar button { font-size: 11pt; padding: 6px 14px; }
.page { width: 297mm; min-height: 210mm; margin: 8mm auto; padding: 9mm 8mm; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.2); display: grid; gap: 4mm; align-content: start; }
@media print { html, body { background: #fff; } .bar { display: none; } .page { margin: 0; box-shadow: none; } }
.head { display: flex; justify-content: space-between; align-items: baseline; }
h1 { font-size: 16pt; margin: 0; letter-spacing: .2em; }
h1 span { font-size: 13pt; letter-spacing: 0; margin-left: 6mm; padding: 1mm 4mm; background: #e6ecf5; }
table { border-collapse: collapse; width: 100%; }
th, td { border: 1px solid #555; padding: 1mm 1.5mm; white-space: nowrap; }
th { background: #eee; font-weight: normal; }
td.n { text-align: right; font-family: "Courier New", monospace; }
td.b { font-weight: bold; }
td.nm { white-space: normal; min-width: 30mm; }
tr.no td { color: #888; }
tfoot td { font-weight: bold; background: #f6f6f6; }
.bottom { display: flex; gap: 8mm; justify-content: flex-end; }
.bottom table { width: auto; font-size: 9.5pt; }
</style></head><body>
<div class="bar"><button onclick="window.print()">印刷する</button><span>A4横で印刷してください。</span></div>
<div class="page">
  <div class="head"><h1>請求書一覧<span>${monthName(m)}締め（締め日 ${ymd(monthEnd(m))}）</span></h1><div>${tt.getFullYear()}/${tt.getMonth() + 1}/${tt.getDate()}現在　${esc(state.srSet?.toName || '')}</div></div>
  <table><thead><tr><th>分類</th><th>番号</th><th>業者名</th><th>支払サイト</th><th>銀行名</th><th>支店名</th><th>預金</th><th>口座番号</th><th>支払期日</th><th>10%対象</th><th>8%対象</th><th>その他</th><th>請求額</th><th>手数料<br>(予定)</th><th>振込予定額</th><th>振込日</th><th>振込額</th><th>振込<br>手数料</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td colspan="9">合計（請求書 ${n}社）</td><td class="n">${yen(t.t10)}</td><td class="n">${yen(t.t8)}</td><td class="n">${yen(t.ot)}</td><td class="n">¥${yen(t.sum)}</td><td class="n">¥${yen(t.fee)}</td><td class="n">${yen(t.pay)}</td><td></td><td class="n">${yen(t.paidAmt)}</td><td class="n">${yen(t.paidFee)}</td></tr></tfoot></table>
  <div class="bottom">
    <table><thead><tr><th colspan="2">支払期日ごとの合計額</th></tr></thead><tbody>${Object.keys(due).sort().map(dd => `<tr><td>${ymd(dd)}</td><td class="n">${yen(due[dd])}</td></tr>`).join('')}<tr><td><b>合計</b></td><td class="n b">${yen(t.pay)}</td></tr></tbody></table>
  </div>
</div>
<script>window.addEventListener('load', () => setTimeout(() => window.print(), 300));<\/script>
</body></html>`;
  }

  /* ---------- 年間一覧 ---------- */

  function monthStatus(m) {
    if (pendingReq(m)) return { cls: 'req', label: '修正依頼中' };
    if (state.submitted[m]) return { cls: 'locked', label: reopened(m) ? '再提出済み' : '提出済み' };
    if (m > thisYM) return { cls: 'none', label: '—' };
    if (reopened(m)) return { cls: 'open', label: '修正中' };
    return ORDER.some(k => state.rows[k].some(r => inMonth(r, m))) ? { cls: 'open', label: '入力中' } : { cls: 'none', label: '未入力' };
  }
  const fyStartOf = m => { const [y, mo] = m.split('-').map(Number); return ym(mo >= FY_START ? y : y - 1, FY_START); };

  function renderYear() {
    const start = fyStartOf(view.month);
    const months = Array.from({ length: 12 }, (_, i) => shiftMonth(start, i));
    const [sy] = start.split('-');
    $('monthLabel').textContent = `${sy}年度`;
    let h = `<div class="ledger-head"><h2>年間一覧　${monthName(months[0])}〜${monthName(months[11])}</h2><p>月を押すと、その月の帳簿が開きます。</p></div>
      <div class="table-box"><table><thead><tr><th>月</th><th>状況</th><th class="num">件数</th><th class="num">現金 月末残高</th><th class="num">現金確認の差額</th><th class="num">売上精算の支払金額</th><th class="num">仕入の請求額</th></tr></thead><tbody>`;
    for (const m of months) {
      const st = monthStatus(m);
      const future = m > thisYM;
      const n = ORDER.reduce((s, k) => s + state.rows[k].filter(r => inMonth(r, m)).length, 0);
      const c = state.counts[m];
      const diff = c ? countTotal(c) - bookCashAt(c.date) : null;
      h += `<tr class="clickable${m === thisYM ? ' current' : ''}" data-month="${m}" tabindex="0">
        <td>${Number(m.slice(5))}月${m === thisYM ? '（今月）' : ''}</td><td><span class="pill ${st.cls}">${st.label}</span></td>
        <td class="num">${future ? '' : n}</td>
        <td class="num">${future ? '' : yen(openingFor('cash', shiftMonth(m, 1)))}</td>
        <td class="num${diff ? ' diff-bad' : ''}">${diff === null ? (future ? '' : '—') : diffText(diff)}</td>
        <td class="num">${state.sr?.[m] ? yen(srCalc(state.sr[m], state.srSet, m).pay) : ''}</td>
        <td class="num">${future ? '' : yen(plInvoices(m).reduce((t, sp) => t + plTotal(plInv(m, sp.id)), 0)) }</td></tr>`;
    }
    $('yearView').innerHTML = h + '</tbody></table></div>';
  }

  function openMonth(m) { view.mode = 'month'; view.month = m; resetView(); render(); window.scrollTo({ top: 0 }); }
  $('yearView').addEventListener('click', e => { const tr = e.target.closest('[data-month]'); if (tr) openMonth(tr.dataset.month); });
  $('yearView').addEventListener('keydown', e => { const tr = e.target.closest('[data-month]'); if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openMonth(tr.dataset.month); } });
  $('yearBtn').addEventListener('click', () => { view.mode = view.mode === 'year' ? 'month' : 'year'; resetView(); render(); });

  /* ---------- 全体 ---------- */

  function render() {
    const year = view.mode === 'year';
    for (const id of ['tabs', 'ledger', 'submitBar']) $(id).hidden = year;
    document.querySelector('.status').hidden = year;
    $('yearView').hidden = !year;
    $('yearBtn').textContent = year ? '月の帳簿に戻る' : '年間一覧';
    $('prevMonth').setAttribute('aria-label', year ? '前の年度' : '前の月');
    $('nextMonth').setAttribute('aria-label', year ? '次の年度' : '次の月');
    if (year) { renderYear(); return; }
    $('monthLabel').textContent = monthName(view.month);
    const isCash = view.ledger === 'cash';
    const isSR = view.ledger === 'sr', isPL = view.ledger === 'pl';
    $('cashPanel').hidden = !isCash; $('entryForm').hidden = isCash || isSR || isPL;
    $('srBox').hidden = !isSR; $('payBox').hidden = !isSR; $('plBox').hidden = !isPL; $('tableBox').hidden = isSR || isPL;
    renderTabs(); renderStatus();
    if (isPL) { renderPL(); renderSubmit(); return; }
    if (isSR) { renderSR(); renderPay(); renderSubmit(); return; }
    renderTable();
    if (isCash) renderCashPanel(); else renderForm();
    renderSubmit();
  }

  function msg(text, ok) { const el = $('formMsg'); el.textContent = text; el.className = 'msg' + (ok ? ' ok' : ''); }
  function resetView() { view.editing = null; view.confirmDel = null; view.cashKind = null; view.draft = null; view.submitStep = null; view.countDraft = null; view.reqForm = false; view.srDraft = null; view.payEdit = null; view.payBank = null; view.plEdit = null; view.spDel = null; view.payDue = null; msg(''); }

  $('tabs').addEventListener('click', e => {
    const b = e.target.closest('button[data-k]'); if (!b) return;
    const keepSubmit = view.submitStep; const keepCount = view.countDraft;
    if (keepSubmit) updateCount();
    view.ledger = b.dataset.k; resetView();
    view.submitStep = keepSubmit; view.countDraft = keepSubmit ? view.countDraft || keepCount : null;
    try { localStorage.setItem(KEY + ':tab', view.ledger); } catch (err) {}
    render();
  });
  $('prevMonth').addEventListener('click', () => { view.month = shiftMonth(view.month, view.mode === 'year' ? -12 : -1); resetView(); render(); });
  $('nextMonth').addEventListener('click', () => { view.month = shiftMonth(view.month, view.mode === 'year' ? 12 : 1); resetView(); render(); });

  $('table').addEventListener('click', e => {
    const pr = e.target.closest('[data-print]');
    if (pr) { printExp(state.rows.cash.find(r => r.id === pr.dataset.print)); return; }
    const ed = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]');
    if (ed) {
      view.confirmDel = null; msg('');
      if (view.ledger === 'cash') {
        const row = state.rows.cash.find(r => r.id === ed.dataset.edit);
        startCash(row.kind, row); render(); $('cashPanel').scrollIntoView({ block: 'nearest' });
      } else { view.editing = ed.dataset.edit; render(); $('entryForm').scrollIntoView({ block: 'nearest' }); }
    }
    if (del) {
      if (view.confirmDel === del.dataset.del) {
        const gone = state.rows[view.ledger].find(r => r.id === del.dataset.del);
        if (gone) logChange(view.month, '削除', view.ledger, gone);
        state.rows[view.ledger] = state.rows[view.ledger].filter(r => r.id !== del.dataset.del);
        if (view.ledger === 'cash') state.rows.bank = state.rows.bank.filter(b => b.from !== del.dataset.del);
        if (view.editing === del.dataset.del) { view.editing = null; view.cashKind = null; view.draft = null; }
        view.confirmDel = null; save(); msg('記入を消しました。', true);
      } else view.confirmDel = del.dataset.del;
      render();
    }
  });

  $('cancelEdit').addEventListener('click', () => { view.editing = null; msg(''); render(); });

  $('entryForm').addEventListener('submit', e => {
    e.preventDefault();
    if (locked()) return;
    const L = LEDGERS[view.ledger];
    const fd = new FormData(e.target);
    const rec = {};
    for (const f of L.fields) {
      if (f.type === 'check') rec[f.k] = fd.get(f.k) === 'on';
      else if (f.type === 'num') rec[f.k] = num(fd.get(f.k));
      else rec[f.k] = String(fd.get(f.k) || '').trim();
    }
    if (!rec.date || !rec.date.startsWith(view.month)) return msg(`日付は${monthName(view.month)}の中から選んでください。`);
    if (!rec.desc) return msg('内容を入力してください。');
    if (L.balance) {
      const hasIn = rec.in > 0, hasOut = rec.out > 0;
      if (!hasIn && !hasOut) return msg('入金か出金のどちらかに金額を入力してください。');
      if (hasIn && hasOut) return msg('入金と出金は別の行に分けて入力してください。');
    } else if (!(rec.amount > 0)) return msg('金額を入力してください。');
    for (const k of Object.keys(rec)) if (rec[k] === undefined || rec[k] === '' || rec[k] === false) delete rec[k];
    if (view.editing) {
      const i = state.rows[view.ledger].findIndex(r => r.id === view.editing);
      if (i >= 0) state.rows[view.ledger][i] = { id: view.editing, ...rec };
      logChange(view.month, '修正', view.ledger, rec);
      view.editing = null; msg('直しました。', true);
    } else {
      state.rows[view.ledger].push({ id: id(), ...rec });
      logChange(view.month, '追加', view.ledger, rec);
      msg('追加しました。', true);
    }
    save(); render();
  });

  $('reloadBtn').addEventListener('click', () => location.reload());
  render();
  boot();
})();
</script>
</body>
</html>
